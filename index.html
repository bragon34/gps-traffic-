<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi ubicación GPS</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            color: #1f2937;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 16px;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
        }

        .status {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #eef2ff;
            color: #3730a3;
            font-size: 14px;
        }

        .status.success {
            background: #ecfdf5;
            color: #047857;
        }

        .status.error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .coordinates {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .coordinate {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
        }

        .coordinate span {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .coordinate strong {
            font-size: 15px;
            word-break: break-all;
        }

        #map {
            width: 100%;
            height: calc(100vh - 250px);
            min-height: 450px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .accuracy {
            margin-top: 10px;
            font-size: 13px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .app {
                padding: 10px;
            }

            .header {
                padding: 15px;
                border-radius: 12px;
            }

            .header h1 {
                font-size: 19px;
            }

            #map {
                height: calc(100vh - 235px);
                min-height: 400px;
                border-radius: 12px;
            }

            .coordinates {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">

        <h1>📍 Mi ubicación GPS</h1>

        <p>
            La aplicación actualizará automáticamente tu posición en el mapa.
        </p>

        <div id="status" class="status">
            📡 Solicitando permiso para acceder a tu ubicación...
        </div>

        <div class="coordinates">
            <div class="coordinate">
                <span>Latitud</span>
                <strong id="latitude">Esperando GPS...</strong>
            </div>

            <div class="coordinate">
                <span>Longitud</span>
                <strong id="longitude">Esperando GPS...</strong>
            </div>
        </div>

        <div class="accuracy">
            Precisión GPS:
            <strong id="accuracy">--</strong>
        </div>

    </div>

    <div id="map"></div>

</div>

<!-- Leaflet JavaScript -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

    // ==========================================================
    // CONFIGURACIÓN
    // ==========================================================

    // Coordenadas utilizadas si el GPS falla o es rechazado.
    // Madrid, España.
    const DEFAULT_LAT = 40.4168;
    const DEFAULT_LON = -3.7038;
    const DEFAULT_ZOOM = 13;

    // ==========================================================
    // ELEMENTOS DE LA INTERFAZ
    // ==========================================================

    const statusElement = document.getElementById("status");
    const latitudeElement = document.getElementById("latitude");
    const longitudeElement = document.getElementById("longitude");
    const accuracyElement = document.getElementById("accuracy");

    // ==========================================================
    // CREAR MAPA
    // ==========================================================

    const map = L.map("map").setView(
        [DEFAULT_LAT, DEFAULT_LON],
        DEFAULT_ZOOM
    );

    // Mapa de OpenStreetMap.
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    // Marcador de la posición del usuario.
    let userMarker = null;

    // Círculo que representa aproximadamente la precisión GPS.
    let accuracyCircle = null;

    // ==========================================================
    // MOSTRAR POSICIÓN DEL USUARIO
    // ==========================================================

    function updatePosition(position) {

        // AQUÍ SE CAPTURA LA UBICACIÓN GPS DEL NAVEGADOR.
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        // Mostrar coordenadas.
        latitudeElement.textContent = latitude.toFixed(7);
        longitudeElement.textContent = longitude.toFixed(7);

        accuracyElement.textContent =
            Math.round(accuracy) + " metros";

        statusElement.textContent =
            "🟢 GPS activo. Tu posición se está actualizando automáticamente.";

        statusElement.className = "status success";

        // ======================================================
        // CREAR O MOVER MARCADOR
        // ======================================================

        if (!userMarker) {

            userMarker = L.marker(
                [latitude, longitude]
            ).addTo(map);

            userMarker.bindPopup(
                "<strong>📍 Tu ubicación</strong><br>" +
                "Lat: " + latitude.toFixed(7) + "<br>" +
                "Lon: " + longitude.toFixed(7)
            );

        } else {

            userMarker.setLatLng([
                latitude,
                longitude
            ]);

            userMarker.setPopupContent(
                "<strong>📍 Tu ubicación</strong><br>" +
                "Lat: " + latitude.toFixed(7) + "<br>" +
                "Lon: " + longitude.toFixed(7)
            );
        }

        // ======================================================
        // CÍRCULO DE PRECISIÓN GPS
        // ======================================================

        if (!accuracyCircle) {

            accuracyCircle = L.circle(
                [latitude, longitude],
                {
                    radius: accuracy,
                    weight: 1,
                    fillOpacity: 0.12
                }
            ).addTo(map);

        } else {

            accuracyCircle.setLatLng([
                latitude,
                longitude
            ]);

            accuracyCircle.setRadius(accuracy);
        }

        // ======================================================
        // CENTRAR MAPA EN LA POSICIÓN ACTUAL
        // ======================================================

        map.setView(
            [latitude, longitude],
            17
        );
    }

    // ==========================================================
    // ERROR DE GPS
    // ==========================================================

    function handleLocationError(error) {

        let message = "";

        switch (error.code) {

            case error.PERMISSION_DENIED:
                message =
                    "❌ No se permitió el acceso a la ubicación. " +
                    "Debes autorizar el GPS para utilizar esta función.";
                break;

            case error.POSITION_UNAVAILABLE:
                message =
                    "⚠️ No fue posible obtener tu ubicación. " +
                    "Comprueba que el GPS esté activado.";
                break;

            case error.TIMEOUT:
                message =
                    "⏱️ El GPS tardó demasiado en responder. " +
                    "Intentaremos obtener tu posición nuevamente.";
                break;

            default:
                message =
                    "⚠️ Ocurrió un error al obtener tu ubicación.";
        }

        statusElement.textContent = message;
        statusElement.className = "status error";

        // Mostrar mapa por defecto.
        map.setView(
            [DEFAULT_LAT, DEFAULT_LON],
            DEFAULT_ZOOM
        );
    }

    // ==========================================================
    // INICIAR GPS
    // ==========================================================

    function startGPS() {

        // Comprobar si el navegador soporta Geolocation API.
        if (!navigator.geolocation) {

            statusElement.textContent =
                "❌ Tu navegador no soporta geolocalización.";

            statusElement.className = "status error";

            return;
        }

        /*
         * watchPosition mantiene una conexión con el GPS.
         *
         * Cada vez que el teléfono detecta una nueva posición,
         * ejecuta automáticamente updatePosition().
         *
         * Por eso el marcador y las líneas futuras podrán
         * actualizarse mientras el usuario se mueve.
         */
        navigator.geolocation.watchPosition(
            updatePosition,
            handleLocationError,
            {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 15000
            }
        );
    }

    // ==========================================================
    // INICIAR AUTOMÁTICAMENTE AL CARGAR LA PÁGINA
    // ==========================================================

    window.addEventListener(
        "load",
        startGPS
    );

</script>

</body>
</html>
